<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <rect width="600" height="340" fill="#ede9df"/>

  <!-- Syringe barrel -->
  <rect x="80" y="130" width="280" height="80" rx="4" stroke="#1c1812" stroke-width="1.5" fill="#fdfaf3"/>

  <!-- Plunger rod -->
  <rect x="350" y="158" width="120" height="4" fill="#1c1812" opacity="0.5"/>
  <rect x="460" y="140" width="12" height="60" rx="2" fill="#1c1812" opacity="0.35"/>

  <!-- Plunger head -->
  <rect x="336" y="136" width="18" height="68" rx="2" stroke="#1c1812" stroke-width="1" fill="#c8bfae"/>

  <!-- Nozzle taper -->
  <path d="M80 130 L50 155 L50 185 L80 210 Z" stroke="#1c1812" stroke-width="1.5" fill="#fdfaf3"/>

  <!-- Nozzle tip -->
  <rect x="30" y="162" width="22" height="16" rx="1" stroke="#1c1812" stroke-width="1.5" fill="#fdfaf3"/>

  <!-- Extrusion flow lines -->
  <line x1="8"  y1="165" x2="2"  y2="165" stroke="#8c1f28" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8"  y1="170" x2="0"  y2="170" stroke="#8c1f28" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="8"  y1="175" x2="2"  y2="175" stroke="#8c1f28" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Flow rate label -->
  <text x="300" y="94" font-family="Georgia, serif" font-size="11" text-anchor="middle"
        fill="#7a7266" letter-spacing="3">LOW-SHEAR EXTRUSION</text>

  <!-- Sensor feedback loop arc -->
  <path d="M160 130 Q160 80 240 80 Q320 80 320 130" stroke="#8c1f28" stroke-width="1"
        stroke-dasharray="4 3" fill="none" opacity="0.6"/>
  <polygon points="318,125 322,135 312,132" fill="#8c1f28" opacity="0.6"/>
  <text x="240" y="72" font-family="Georgia, serif" font-size="9" text-anchor="middle"
        fill="#8c1f28" letter-spacing="2" opacity="0.8">FEEDBACK CONTROL</text>

  <!-- Control unit box -->
  <rect x="420" y="240" width="120" height="70" rx="2" stroke="#1c1812" stroke-width="1" fill="#fdfaf3" opacity="0.8"/>
  <text x="480" y="272" font-family="Georgia, serif" font-size="9" text-anchor="middle"
        fill="#7a7266" letter-spacing="1">PID CONTROLLER</text>
  <line x1="420" y1="260" x2="360" y2="210" stroke="#1c1812" stroke-width="0.75"
        stroke-dasharray="3 3" opacity="0.4"/>

  <!-- Dimension annotation -->
  <line x1="80" y1="228" x2="360" y2="228" stroke="#1c1812" stroke-width="0.75" opacity="0.3"/>
  <line x1="80" y1="222" x2="80" y2="234" stroke="#1c1812" stroke-width="0.75" opacity="0.3"/>
  <line x1="360" y1="222" x2="360" y2="234" stroke="#1c1812" stroke-width="0.75" opacity="0.3"/>
  <text x="220" y="242" font-family="Georgia, serif" font-size="9" text-anchor="middle"
        fill="#7a7266" letter-spacing="1" opacity="0.7">EXTRUSION BARREL</text>

  <!-- Corner label -->
  <text x="300" y="316" font-family="Georgia, serif" font-size="10" text-anchor="middle"
        fill="#7a7266" letter-spacing="2" opacity="0.5">CONCEPT · SUMMER 2026</text>
</svg>
